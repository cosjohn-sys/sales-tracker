name: Deploy Laravel 10 to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo, pdo_mysql, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare deployment
        run: |
          rm -rf deploy
          mkdir deploy

          # Copy Laravel application files
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='public' \
            ./ deploy/

          # Copy everything from public/ into the web root
          rsync -av public/ deploy/

          # Fix Laravel 10 index.php paths
          sed -i "s#__DIR__.'/../#__DIR__.'/#g" deploy/index.php

          # Replace .htaccess with a simple Laravel rewrite
          cat > deploy/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
              RewriteEngine On

              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule ^ index.php [L]
          </IfModule>
          EOF

          echo "Deployment prepared:"
          ls -la deploy
          echo "Laravel index.php:"
          cat deploy/index.php

      - name: Upload to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /htdocs/